<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KERALA BUS LIVE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F2F2F2;font-family:'Segoe UI',sans-serif;padding-bottom:80px}
.top{background:#fff;padding:16px;position:sticky;top:0;box-shadow:0 1px 10px rgba(0,0,0,.06);display:flex;align-items:center;gap:10px;z-index:10}
.top h1{font-size:19px;font-weight:900}.top p{font-size:12px;color:#888}
.top span{background:#FF6B00;color:#fff;font-size:10px;padding:3px 7px;border-radius:20px;margin-left:5px}
.searchCard{background:#fff;margin:14px 16px 0;border-radius:18px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.searchCard label{font-size:12px;color:#888}.searchCard b{font-size:18px;display:block}
.div{height:1px;background:#eee;margin:12px 0}
.meta{display:flex;gap:12px;align-items:center;margin:14px 16px;font-size:13px}
.meta button{margin-left:auto;background:#FF6B00;color:#fff;border:none;padding:10px 16px;border-radius:20px;font-weight:800}
.filt{display:flex;gap:8px;padding:0 16px;overflow:auto}.filt button{border:1px solid #ddd;background:#fff;padding:8px 14px;border-radius:20px;white-space:nowrap}.filt button.on{background:#FF6B00;color:#fff;border-color:#FF6B00;font-weight:700}
.list{padding:12px 16px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 18px rgba(0,0,0,.05);cursor:pointer}
.cardTop{display:flex;gap:12px}.cardTop img{width:90px;height:90px;object-fit:cover;border-radius:12px}
.badge{font-size:11px;font-weight:700;padding:4px 8px;border-radius:20px;background:#FFE8D6;color:#D95A00}
.time{font-size:16px;font-weight:800;margin:6px 0 2px}.route{font-size:13px;color:#777}.fac{font-size:11px;color:#555;margin-top:4px}
.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:12px;border-top:1px dashed #eee;padding-top:10px}
.price{font-size:20px;font-weight:900}.price small{display:block;font-size:11px;color:#999;font-weight:400}
.sel{background:#FF6B00;color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:800;cursor:pointer}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:12px 0;z-index:10}.nav div{font-size:11px;color:#888;text-align:center}.nav div.on{color:#FF6B00;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:999}.modal.open{display:flex}.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:20px;max-height:85vh;overflow:auto}.sheet img{width:100%;height:180px;object-fit:cover;border-radius:14px}
.book{width:100%;background:#0E7A3D;color:#fff;border:none;padding:15px;border-radius:14px;font-weight:800;font-size:16px;margin-top:14px;cursor:pointer}
.close{width:100%;background:#eee;border:none;padding:12px;border-radius:12px;margin-top:8px;font-weight:700}
</style>
</head>
<body>
<div class="top"><div style="font-size:28px">🚌</div><div><h1>KERALA BUS LIVE<span>PREMIUM • v4</span></h1><p>Live Tracking • Safe • Reliable</p></div></div>
<div class="searchCard"><label>From</label><b>Kochi</b><div class="div"></div><label>To</label><b>Trivandrum</b></div>
<div class="meta"><span>📅 Today</span><span>👤 1 Passenger</span><button>Search Buses</button></div>
<div style="padding:4px 16px"><h3>Available Buses</h3></div>
<div class="filt" id="filt">
<button class="on" onclick="setCat(this,'All')">All</button>
<button onclick="setCat(this,'Superfast')">Superfast</button>
<button onclick="setCat(this,'Night')">Night</button>
<button onclick="setCat(this,'AC')">AC</button>
</div>
<div class="list" id="list"></div>
<div class="nav"><div class="on">🏠<br>Home</div><div>🎫<br>Trips</div><div>📍<br>Live Track</div><div>🔥<br>Offers</div><div>👤<br>Profile</div></div>

<div class="modal" id="modal"><div class="sheet"><img id="mImg"><h2 id="mName" style="margin:10px 0 4px"></h2><p id="mRoute" style="color:#888"></p><p id="mStops" style="margin:12px 0;line-height:1.6;color:#444"></p><p id="mTime" style="font-weight:700"></p><p id="mPrice" style="font-size:22px;font-weight:900;color:#FF6B00;margin-top:8px"></p><button class="book" onclick="window.open('https://onlineksrtc.com','_blank')">Book on Official KSRTC →</button><button class="close" onclick="closeM()">Close ✕</button></div></div>

<script>
let cat='All';
let buses=[
{id:0,name:"KSRTC Superfast",from:"Kochi",to:"Trivandrum",time:"7:30 AM → 12:30 PM • 5h",price:180,type:"Superfast",img:"https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?w=800&q=80",stops:"Kochi → Alappuzha → Kollam → Trivandrum"},
{id:1,name:"Night Rider",from:"Ernakulam",to:"Thrissur",time:"10:00 PM → 12:30 AM • 2h 30m",price:220,type:"Night",img:"https://images.unsplash.com/photo-1570125909232-eb263c188f7e?w=800&q=80",stops:"Ernakulam → Angamaly → Thrissur"},
{id:2,name:"AC Low Floor",from:"Kochi",to:"Kozhikode",time:"8:00 AM → 12:00 PM • 4h",price:350,type:"AC",img:"https://images.unsplash.com/photo-1557223562-6c77ef16210f?w=800&q=80",stops:"Kochi → Thrissur → Kozhikode"},
{id:3,name:"City Fast",from:"Ottappalam",to:"Palakkad",time:"9:15 AM → 10:15 AM • 1h",price:60,type:"Superfast",img:"https://images.unsplash.com/photo-1464219789935-c2d9d9aba644?w=800&q=80",stops:"Ottappalam → Shoranur → Palakkad"},
];
function setCat(b,c){cat=c;document.querySelectorAll('#filt button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter();}
function filter(){
  let f=buses.filter(b=>cat=='All'||b.type==cat);
  document.getElementById('list').innerHTML=f.map(b=>`
  <div class="card" onclick="openB(${b.id})">
    <div class="cardTop"><img src="${b.img}"><div><span class="badge">${b.type} • KSRTC</span><div class="time">${b.time}</div><div class="route">${b.from} → ${b.to}</div><div class="fac">⭐ 4.6 • Live Tracking • AC</div></div></div>
    <div class="bottom"><div class="price">₹${b.price}<small>per seat</small></div><button class="sel" onclick="event.stopPropagation();openB(${b.id})">Select Seats</button></div>
  </div>`).join('');
}
function openB(id){
  let cur=buses.find(b=>b.id===id);
  document.getElementById('mImg').src=cur.img;
  document.getElementById('mName').innerText=cur.name;
  document.getElementById('mRoute').innerText=cur.from+' → '+cur.to;
  document.getElementById('mStops').innerText='Stops: '+cur.stops;
  document.getElementById('mTime').innerText=cur.time;
  document.getElementById('mPrice').innerText='₹'+cur.price+' per seat';
  document.getElementById('modal').classList.add('open');
}
function closeM(){document.getElementById('modal').classList.remove('open');}
document.getElementById('modal').addEventListener('click',function(e){ if(e.target===this) closeM(); });
filter();
</script>
</body>
</html>
