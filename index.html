<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrackNow - Movie Gross Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0a0a;color:#fff;padding-bottom:30px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#000;position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:900}
.logo span{color:#22c55e;font-size:24px}
.movie-head{padding:16px}
.movie-head h1{font-size:26px;line-height:1.2}
.movie-head p{color:#aaa;font-size:13px;margin-top:6px}
.movie-head .live{color:#22c55e;font-weight:bold;font-size:12px}
.tabs{display:flex;gap:10px;padding:10px 16px;overflow-x:auto}
.tab{padding:11px 18px;border-radius:10px;border:1px solid #333;background:#111;color:#aaa;white-space:nowrap;font-weight:bold;cursor:pointer}
.tab.active{background:#22c55e;color:#000;border-color:#22c55e}
.tab2wrap{padding:0 16px 12px}
.tab2{display:inline-flex;background:#111;border:1px solid #222;border-radius:10px;padding:4px;gap:4px}
.tab2 button{padding:8px 14px;border:none;border-radius:8px;background:transparent;color:#aaa;font-weight:bold;cursor:pointer}
.tab2 button.active{background:#222;color:#fff}
.search{margin:0 16px 12px;width:calc(100% - 32px);padding:12px;border-radius:10px;border:1px solid #222;background:#111;color:#fff;outline:none}
.card{background:#131313;border:1px solid #222;border-radius:16px;margin:0 16px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
th{padding:14px 12px;text-align:left;color:#999;font-size:12px;letter-spacing:1px}
td{padding:15px 12px;border-top:1px solid #222}
td:first-child{font-weight:bold}
.green{color:#22c55e;font-weight:bold}
.total{background:#14532d}
.total td{font-weight:900;font-size:15px;border-top:none}
.total .green{color:#4ade80}
.page{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;color:#777;font-size:13px}
.form{background:#131313;padding:18px;border-radius:16px;margin:16px}
.form h3{margin-bottom:12px}
input,select{width:100%;padding:13px;margin:6px 0;border-radius:10px;border:none;outline:none;background:#222;color:#fff;font-size:14px}
.add{background:#22c55e;color:#000;width:100%;padding:14px;border:none;border-radius:10px;font-weight:900;margin-top:8px;font-size:15px}
.del{background:transparent;border:none;color:#ff5c5c;font-size:16px;cursor:pointer}
.small{color:#888;font-size:12px;margin-top:8px}
</style>
</head>
<body>

<header>
<div class="logo"><span>📈</span> TrackNow</div>
<div style="font-size:22px">☰</div>
</header>

<div class="movie-head">
<p class="live">● LIVE • <span id="time"></span></p>
<h1 id="movieTitle">Ramayana: Rise of a Legend<br>Box Office Collection</h1>
<p>MovieMint pole - State wise live gross tracking</p>
</div>

<div style="padding:0 16px 10px">
<select id="movieSelect" onchange="changeMovie()">
<option>Ramayana: Rise of a Legend</option>
<option>Pushpa 2</option>
<option>Kalki 2898 AD</option>
<option>Devara</option>
<option>Jawan</option>
<option>Animal</option>
<option>Custom Movie...</option>
</select>
</div>

<div class="tabs">
<button class="tab active" onclick="setMode(this,'STATE')">🌍 State Wise</button>
<button class="tab" onclick="setMode(this,'LANGUAGE')">🌐 Language Wise</button>
<button class="tab" onclick="setMode(this,'FORMAT')">🎬 Format Wise</button>
</div>

<div class="tab2wrap"><div class="tab2"><button class="active">⊞ Table</button><button onclick="alert('Map soon!')">🗺 Map</button></div></div>

<input class="search" id="search" onkeyup="render()" placeholder="🔍 Search State...">

<div class="card">
<table>
<thead><tr><th id="col1">STATE</th><th>GROSS</th><th>SHOWS</th><th>TICKETS SOLD</th><th></th></tr></thead>
<tbody id="list"></tbody>
<tbody><tr class="total"><td>TOTAL</td><td class="green" id="tGross">₹0</td><td id="tShows">0</td><td id="tTickets">0</td><td></td></tr></tbody>
</table>
</div>

<div class="page"><span id="pageInfo"></span><span>Page 1 of 5 ›</span></div>

<div class="form">
<h3>➕ Add Gross - Site il Varum</h3>
<input id="place" placeholder="State - eg: Kerala">
<input id="gross" type="number" placeholder="Gross in Rupees - eg: 92400000">
<input id="shows" type="number" placeholder="Shows - eg: 3760">
<input id="tickets" placeholder="Tickets Sold - eg: 1.68L">
<button class="add" onclick="addRow()">+ Add To Site</button>
<p class="small">Add cheythal udane mugalil table il varum. Refresh cheythalum pokilla.</p>
</div>

<script>
let data = JSON.parse(localStorage.getItem('tracknow_gross')||'[]');
if(data.length==0){
data=[
{place:"Maharashtra",gross:92400000,shows:3760,tickets:"1.68L"},
{place:"Karnataka",gross:75200000,shows:1590,tickets:"1.49L"},
{place:"Uttar Pradesh",gross:51900000,shows:2230,tickets:"1.17L"},
{place:"Gujarat",gross:39100000,shows:3480,tickets:"92.66K"},
{place:"Delhi",gross:37300000,shows:764,tickets:"54.49K"},
{place:"Tamil Nadu",gross:33800000,shows:950,tickets:"1.64L"},
{place:"Telangana",gross:23200000,shows:1160,tickets:"89.66K"},
{place:"Kerala",gross:18500000,shows:820,tickets:"98.20K"},
];
save();
}
function fmt(n){ if(n>=10000000) return "₹"+(n/10000000).toFixed(2)+"Cr"; if(n>=100000) return "₹"+(n/100000).toFixed(2)+"L"; return "₹"+n; }
function fmtShow(n){ if(n>=1000) return (n/1000).toFixed(2)+"K"; return n; }
function save(){ localStorage.setItem('tracknow_gross', JSON.stringify(data)); }
function setMode(btn,txt){ document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); document.getElementById('col1').innerText=txt; }
function changeMovie(){
let m=document.getElementById('movieSelect').value;
if(m=='Custom Movie...'){ let c=prompt('Movie peru ezhuthu:'); if(c) document.getElementById('movieTitle').innerHTML=c+"<br>Box Office Collection"; return; }
document.getElementById('movieTitle').innerHTML=m+"<br>Box Office Collection";
}
function render(){
let q=document.getElementById('search').value.toLowerCase();
let f=data.filter(d=>d.place.toLowerCase().includes(q));
let tg=0, ts=0; f.forEach(d=>{ tg+=d.gross; ts+=d.shows; });
document.getElementById('list').innerHTML=f.map(d=>`<tr><td>${d.place}</td><td class="green">${fmt(d.gross)}</td><td>${fmtShow(d.shows)}</td><td>${d.tickets}</td><td><button class="del" onclick="del('${d.place}')">✕</button></td></tr>`).join('');
document.getElementById('tGross').innerText=fmt(tg);
document.getElementById('tShows').innerText=fmtShow(ts);
document.getElementById('tTickets').innerText=f.length+" States";
document.getElementById('pageInfo').innerText="1-"+f.length+" of "+f.length+" states";
}
function addRow(){
let p=document.getElementById('place').value.trim();
let g=parseInt(document.getElementById('gross').value||0);
let s=parseInt(document.getElementById('shows').value||0);
let t=document.getElementById('tickets').value.trim();
if(!p){ alert('State kodukku'); return; }
data.unshift({place:p,gross:g,shows:s,tickets:t||"0"});
save(); render();
document.getElementById('place').value='';document.getElementById('gross').value='';document.getElementById('shows').value='';document.getElementById('tickets').value='';
alert('Site il vannu ✅');
}
function del(place){ if(confirm('Delete cheyyano?')){ data=data.filter(d=>d.place!=place); save(); render(); } }
setInterval(()=>{ document.getElementById('time').innerText=new Date().toLocaleString(); },1000);
render();
</script>
</body>
</html>
