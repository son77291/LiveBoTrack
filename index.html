<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KERALA BUS LIVE</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:16px}
h1{color:#FFD400;text-align:center;font-size:28px}
input{width:100%;padding:12px;border-radius:8px;border:none;background:#1a1a1a;color:#fff;box-sizing:border-box}
.cats{display:flex;gap:8px;overflow:auto;margin:14px 0}
.cats button{padding:6px 14px;border-radius:20px;border:none;background:#222;color:#fff;white-space:nowrap}
.cats button.active{background:#FFD400;color:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#111;border-radius:12px;padding:12px;border:1px solid #222;cursor:pointer}
.card:active{transform:scale(0.97)}
.poster{background:#222;height:80px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:32px}
.name{font-weight:bold;margin-top:8px}
.route{color:#aaa;font-size:12px}
.row{display:flex;justify-content:space-between;margin-top:8px;color:#FFD400;font-size:13px}
.live{color:#00e676;font-size:11px;margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:flex-end;z-index:99}
.modal.open{display:flex}
.box{background:#111;width:100%;border-radius:20px 20px 0 0;padding:20px;box-sizing:border-box}
.box h2{margin:0;color:#FFD400}
.close{float:right;background:#222;color:#fff;border:none;padding:8px 12px;border-radius:50%;font-size:16px}
.stops{color:#ccc;font-size:14px;line-height:1.8;margin:12px 0}
.book{width:100%;background:#FFD400;border:none;padding:14px;border-radius:10px;font-weight:bold;font-size:16px}
.call{width:100%;background:#222;color:#fff;border:none;padding:12px;border-radius:10px;margin-top:8px}
</style>
</head>
<body>
<h1>KERALA BUS LIVE</h1>
<input id="search" placeholder="Search bus / route..." oninput="filter()">
<div class="cats">
<button class="active" onclick="setCat(this,'All')">All</button>
<button onclick="setCat(this,'Superfast')">Superfast</button>
<button onclick="setCat(this,'Night')">Night</button>
<button onclick="setCat(this,'AC')">AC</button>
</div>
<div class="grid" id="grid"></div>

<div class="modal" id="modal" onclick="if(event.target==this) closeModal()">
<div class="box">
<button class="close" onclick="closeModal()">✕</button>
<h2 id="mName"></h2>
<p id="mRoute" style="color:#aaa"></p>
<div class="stops" id="mStops"></div>
<p>Time: <b id="mTime" style="color:#FFD400"></b> | Price: <b id="mPrice" style="color:#FFD400"></b></p>
<p style="color:#00e676">● LIVE - Running on time</p>
<button class="book" onclick="alert('Booking coming soon!')">Book Now</button>
<button class="call">📞 Call Conductor</button>
</div>
</div>

<script>
let cat='All';
let buses=[
{name:"KSRTC Superfast",route:"Kochi → Trivandrum",time:"7:30 AM",price:"₹180",type:"Superfast",stops:"Ernakulam → Alappuzha → Kollam → Trivandrum"},
{name:"Night Rider",route:"Ernakulam → Thrissur",time:"10:00 PM",price:"₹220",type:"Night",stops:"Ernakulam → Aluva → Angamaly → Thrissur"},
{name:"AC Low Floor",route:"Kochi → Kozhikode",time:"8:00 AM",price:"₹350",type:"AC",stops:"Kochi → Thrissur → Kozhikode"},
{name:"City Fast",route:"Ottappalam → Palakkad",time:"9:15 AM",price:"₹60",type:"Superfast",stops:"Ottappalam → Shoranur → Palakkad"},
];
function setCat(btn,c){cat=c;document.querySelectorAll('.cats button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');filter();}
function filter(){
let q=document.getElementById('search').value.toLowerCase();
let f=buses.filter(b=>(cat==='All'||b.type===cat)&&(b.name.toLowerCase().includes(q)||b.route.toLowerCase().includes(q)));
document.getElementById('grid').innerHTML=f.map((b,i)=>`<div class="card" onclick="openBus(${buses.indexOf(b)})"><div class="poster">🚌</div><div class="name">${b.name}</div><div class="route">${b.route}</div><div class="row"><span>${b.time}</span><b>${b.price}</b></div><div class="live">● LIVE</div></div>`).join('');
}
function openBus(i){
let b=buses[i];
document.getElementById('mName').innerText=b.name;
document.getElementById('mRoute').innerText=b.route;
document.getElementById('mStops').innerText="Stops: "+b.stops;
document.getElementById('mTime').innerText=b.time;
document.getElementById('mPrice').innerText=b.price;
document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
filter();
</script>
</body>
</html>
