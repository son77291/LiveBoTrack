<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TrackNow TEST</title>
<style>body{background:#000;color:#fff;font-family:Arial;padding:16px} .banner{background:orange;padding:20px;border-radius:16px;color:#000;font-weight:900;font-size:20px;text-align:center;cursor:pointer} .box{background:#151515;padding:16px;border-radius:12px;margin-top:12px} table{width:100%} td{padding:10px;border-bottom:1px solid #333} .green{color:#22c55e;font-weight:bold} button{background:#22c55e;border:none;padding:12px;border-radius:10px;font-weight:900;width:100%;margin-top:10px} .hidden{display:none}</style>
</head>
<body>
<div id="home">
<h1>📈 TrackNow</h1>
<div class="banner" onclick="openMovie()">🏹 RAMAYANA<br><span style="font-size:14px">👆 CLICK HERE TO VIEW GROSS</span></div>
<div class="box">🟢 LIVE • Next Update 20:00<br>New Release: Ramayana, Toxic, Kantara 2</div>
</div>
<div id="detail" class="hidden">
<button onclick="showHome()" style="background:#333;color:#fff">← Back</button>
<h2>Ramayana<br>Box Office Collection</h2>
<div class="box">
<table>
<tr><td>Maharashtra</td><td class="green">₹9.24 Cr</td></tr>
<tr><td>Karnataka</td><td class="green">₹7.52 Cr</td></tr>
<tr><td>Kerala</td><td class="green">₹1.85 Cr</td></tr>
<tr><td><b>TOTAL</b></td><td class="green"><b>₹38.42 Cr</b></td></tr>
</table>
</div>
<p style="color:#aaa;font-size:12px">Ithu kandallo? Click work aayi ennu artham ✅</p>
</div>
<script>
function openMovie(){ alert("Clicked ✅ Gross thurakkunnu..."); document.getElementById('home').style.display='none'; document.getElementById('detail').classList.remove('hidden'); window.scrollTo(0,0); }
function showHome(){ document.getElementById('detail').classList.add('hidden'); document.getElementById('home').style.display='block'; }
</script>
</body>
</html>
