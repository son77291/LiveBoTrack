<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrackNow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0a0a;color:#fff;padding:16px}
h1{font-size:24px} h1 span{color:#22c55e}
.sub{color:#888;font-size:13px;margin:6px 0 14px}
.live{background:#14532d;border:1px solid #22c55e;padding:12px;border-radius:12px;display:flex;justify-content:space-between;font-size:13px;margin-bottom:14px}
.card{background:#151515;border:1px solid #222;border-radius:14px;padding:14px;display:flex;gap:12px;margin-bottom:10px;cursor:pointer}
.poster{font-size:32px}
.info{flex:1} .info p{color:#888;font-size:12px;margin-top:3px}
.gross{color:#22c55e;font-weight:900;text-align:right}
.gross small{color:#888;font-weight:400;display:block;font-size:11px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:13px 8px;border-bottom:1px solid #222;text-align:left}
th{color:#888;font-size:12px}
.green{color:#22c55e;font-weight:bold}
.total td{font-weight:900;background:#14532d}
button{background:#222;color:#fff;border:none;padding:10px 14px;border-radius:10px;margin-bottom:12px}
.hidden{display:none}
</style>
</head>
<body>

<div id="home">
<h1>📈 Track<span>Now</span></h1>
<p class="sub">Simple Movie Gross Tracker</p>
<div class="live"><span>🟢 LIVE</span><span id="next">Next Update 20:00</span></div>
<div id="list"></div>
<p style="color:#555;font-size:12px;text-align:center;margin-top:10px">Gross thanne update aakum • 20 min koodumbol</p>
</div>

<div id="detail" class="hidden">
<button onclick="showHome()">← Back</button>
<h2 id="title" style="margin-bottom:4px">Ramayana</h2>
<p class="sub">State Wise Gross • Auto Update</p>
<div class="live"><span id="last">Last Updated: Just Now</span><span id="next2">20:00</span></div>
<table>
<tr><th>STATE</th><th>GROSS</th><th>SHOWS</th></tr>
<tbody id="rows"></tbody>
<tr class="total"><td>TOTAL</td><td class="green" id="tg">₹0</td><td id="ts">0</td></tr>
</table>
</div>

<script>
let movies=[
{name:"Ramayana",emoji:"🏹",lang:"Hindi"},
{name:"Pushpa 2",emoji:"🔥",lang:"Telugu"},
{name:"Kalki 2898 AD",emoji:"🚀",lang:"Telugu"},
{name:"Toxic",emoji:"🦁",lang:"Kannada • Coming Soon"},
];
let data=[
{place:"Maharashtra",gross:92400000,shows:3760},
{place:"Karnataka",gross:75200000,shows:1590},
{place:"Uttar Pradesh",gross:51900000,shows:2230},
{place:"Gujarat",gross:39100000,shows:3480},
{place:"Delhi",gross:37300000,shows:764},
{place:"Tamil Nadu",gross:33800000,shows:950},
{place:"Telangana",gross:23200000,shows:1160},
{place:"Kerala",gross:18500000,shows:820},
];
function fmt(n){return "₹"+(n/10000000).toFixed(2)+" Cr"}
function total(){return data.reduce((a,b)=>a+b.gross,0)}
function renderHome(){
document.getElementById('list').innerHTML=movies.map(m=>`
<div class="card" onclick="openMovie('${m.name}')">
<div class="poster">${m.emoji}</div>
<div class="info"><b>${m.name}</b><p>${m.lang}</p></div>
<div class="gross">${m.name=='Ramayana'?fmt(total()):'₹12.10 Cr'}<small>Tap to View →</small></div>
</div>`).join('');
}
function renderDetail(){
document.getElementById('rows').innerHTML=data.map(d=>`<tr><td>${d.place}</td><td class="green">${fmt(d.gross)}</td><td>${d.shows}</td></tr>`).join('');
document.getElementById('tg').innerText=fmt(total());
document.getElementById('ts').innerText=data.reduce((a,b)=>a+b.shows,0);
}
function openMovie(n){
document.getElementById('title').innerText=n;
document.getElementById('home').classList.add('hidden');
document.getElementById('detail').classList.remove('hidden');
renderDetail(); window.scrollTo(0,0);
}
function showHome(){document.getElementById('detail').classList.add('hidden');document.getElementById('home').classList.remove('hidden');}

// AUTO UPDATE - 20 MIN
let
